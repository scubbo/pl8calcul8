name: Build server image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/server-image.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Pins the freshly-built image in homelab-configuration so ArgoCD deploys
  # it. Mirrors blog-content's update-deployment-repo pattern: a GitHub App
  # token (same deployment app) authorizes the cross-repo push.
  update-deployment-repo:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Mint deployment token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23linrv3EjCnSWuWoS
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          owner: scubbo
          repositories: homelab-configuration
          # Revocation is handled by the explicit step at the end of this job,
          # so the token dies at its last point of use.
          skip-token-revoke: true

      - name: Check out homelab-configuration
        uses: actions/checkout@v4
        with:
          repository: scubbo/homelab-configuration
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin new image tag
        run: |
          yq -i '.image.tag = "sha-${{ github.sha }}"' charts/pl8calcul8/values.yaml

      - name: Commit and push
        run: |
          git config --global user.email "auto-updater@scubbo.org"
          git config --global user.name "UpdaterBot"
          git add charts/pl8calcul8/values.yaml
          git commit -m "Update pl8calcul8 server to sha-${{ github.sha }}"
          git push

      # Runs even when an earlier step failed, so a mid-job failure cannot
      # leave a usable token behind. Skipped if minting itself failed.
      - name: Revoke deployment token
        if: always() && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api --method DELETE /installation/token
